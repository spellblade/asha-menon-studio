name: Feature Request
description: Propose a new feature or enhancement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        This repo is a personal CV. Features that turn it into a multi-tenant product need a strong case.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
  - type: textarea
    id: context
    attributes:
      label: Additional Context
